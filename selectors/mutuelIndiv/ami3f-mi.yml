# Sélecteurs pour AMI3F - Mutuelle Individuelle (assuMutuelIndiv/Ami3fMIService)
# Modifie ce fichier quand le site AMI3F change -- pas besoin de recompiler.
# Redémarrage NON requis : le fichier est rechargé automatiquement (détection par date de modification).

connexion:
  login_xpath: "//input[@name='login']"
  password_xpath: "//input[@name='password']"
  submit_xpath: "//button[@type='submit']"

navigation:
  menu_tarif_xpath: "//*[@id='navmenu-tarif']"
  complementaire_sante_xpath: "//span[normalize-space()='Complémentaire Santé']"
  acceder_tarification_xpath: "//span[normalize-space()='ACCÉDER A LA TARIFICATION']"
  suivant_xpath: "//input[@src='img/suivant.jpg']"

assure1:
  nom_id: nom_assure_1
  prenom_id: prenom_assure_1
  nom_naissance_id: nom_naiss_assure_1
  date_naissance_id: dt_naiss_assure_1
  pays_naissance_select_id: pays_naiss_assure_1
  cp_naissance_id: cp_naiss_assure_1
  ville_naissance_select_id: ville_naiss_assure_1
  sexe_select_id: sexe_assure_1
  situation_familiale_select_id: i_sitfam
  regime_select_id: regime_assure_1
  profession_id: profession_assure_1
  ppe_id: div_radio_is_ppe_assure_1_false
  ppe_famille_id: radio_ppe_famille_assure_1_false

assure2:
  ajouter_conjoint_id: btn-add-conjoint
  nom_id: nom_assure_2
  prenom_id: prenom_assure_2
  nom_naissance_id: nom_naiss_assure_2
  date_naissance_id: dt_naiss_assure_2
  pays_naissance_select_id: pays_naiss_assure_2
  cp_naissance_id: cp_naiss_assure_2
  ville_naissance_select_id: ville_naiss_assure_2
  sexe_select_id: sexe_assure_2
  regime_select_id: regime_assure_2
  profession_id: profession_assure_2
  ppe_id: div_radio_is_ppe_assure_2_false
  ppe_famille_id: radio_ppe_famille_assure_2_false

enfant1:
  ajouter_id: btn-add-enfant
  sexe_select_id: sexe_enfant_1
  nom_id: nom_enfant_1
  prenom_id: prenom_enfant_1
  date_naissance_id: dt_naiss_enfant_1
  pays_naissance_select_id: pays_naiss_enfant_1
  cp_naissance_id: cp_naiss_enfant_1
  ville_naissance_select_id: ville_naiss_enfant_1
  regime_select_id: regime_enfant_1

enfant2:
  ajouter_id: btn-add-enfant
  sexe_select_id: sexe_enfant_2
  nom_id: nom_enfant_2
  prenom_id: prenom_enfant_2
  date_naissance_id: dt_naiss_enfant_2
  # Id historique du code source pour ce champ (identique à assure2.pays_naissance_select_id) -- à vérifier
  # sur le site si la sélection du pays de naissance du 2e enfant ne fonctionne pas.
  pays_naissance_select_id: pays_naiss_assure_2
  cp_naissance_id: cp_naiss_enfant_2
  ville_naissance_select_id: ville_naiss_enfant_2
  regime_select_id: regime_enfant_2

adresse_risque:
  adresse_id: r_adresse_1
  code_postal_id: r_code_postal
  ville_select_id: r_ville

textes:
  regime_general_contains: "Régime général"
  regime_enfant_contains: "de l'adhérent principal"
  sexe_homme: "Homme"
  sexe_femme: "Femme"
  sexe_masculin: "Masculin"
  sexe_feminin: "Féminin"
  situation_celibataire: "Célibataire"
  situation_marie_contains: "Marié"

resultats:
  # %d est remplacé par l'id de la formule (idFormule à 7) dans le code
  prix_selector_template: "tr.formule-disponible[data-id='%d'] td.ttc span"
